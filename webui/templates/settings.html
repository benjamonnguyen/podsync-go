{{define "content"}}
<h1>Settings</h1>
{{if .Flash}}<div class="notice ok">{{.Flash}}</div>{{end}}
{{if .Err}}<div class="notice err"><strong>Not saved.</strong><pre>{{.Err}}</pre></div>{{end}}
<form method="post" action="/settings" class="settings">
  <fieldset>
    <legend>Server</legend>
    <label>Public address of this server
      <input type="text" name="base_url" value="{{.Cfg.Server.BaseURL}}" required>
      <small>Used in podcast feed links, so podcast apps must be able to reach it (e.g. http://192.168.1.10:8080).</small></label>
    <label>Listen address
      <input type="text" name="listen_addr" value="{{.Cfg.Server.ListenAddr}}" required>
      <small>Requires a restart.</small></label>
    <label>Data directory
      <input type="text" name="data_dir" value="{{.Cfg.Server.DataDir}}" required>
      <small>Where media and metadata are stored. Requires a restart; existing files are not moved.</small></label>
  </fieldset>
  <fieldset>
    <legend>Downloading</legend>
    <label>yt-dlp path <input type="text" name="yt_dlp_path" value="{{.Cfg.Download.YtDlpPath}}" required></label>
    <label>Simultaneous downloads <input type="number" name="concurrency" min="1" max="16" value="{{.Cfg.Download.Concurrency}}" required></label>
    <label>Check feeds every <input type="text" name="update_interval" value="{{.Cfg.Download.UpdateInterval}}" required><small>For example 30m or 2h. Minimum 1m.</small></label>
    <label>Cookies file <input type="text" name="cookies_file" value="{{.Cfg.Download.CookiesFile}}"><small>Optional cookies.txt (Netscape format) for YouTube sign-in checks.</small></label>
    <label class="check"><input type="checkbox" name="self_update"{{if .Cfg.Download.SelfUpdate}} checked{{end}}> Keep yt-dlp up to date (runs <code>yt-dlp -U</code> daily)</label>
  </fieldset>
  <fieldset>
    <legend>Defaults for feeds</legend>
    <p class="muted">Each feed can override these on its own settings page.</p>
    <label>Format
      <select name="format">
        <option value="video"{{if eq .Cfg.Defaults.Format "video"}} selected{{end}}>Video (mp4)</option>
        <option value="audio"{{if eq .Cfg.Defaults.Format "audio"}} selected{{end}}>Audio only (m4a)</option>
      </select></label>
    <label>Maximum resolution (pixels of height, 0 = no limit) <input type="number" name="max_resolution" min="0" value="{{.Cfg.Defaults.MaxResolution}}" required></label>
    <label class="check"><input type="checkbox" name="exclude_shorts"{{if .Cfg.Defaults.ExcludeShorts}} checked{{end}}> Skip YouTube Shorts (videos of 60 seconds or less)</label>
    <label>Only download titles matching (regex) <input type="text" name="title_include" value="{{.Cfg.Defaults.TitleInclude}}" placeholder="empty = all titles"></label>
    <label>Skip titles matching (regex) <input type="text" name="title_exclude" value="{{.Cfg.Defaults.TitleExclude}}" placeholder="empty = skip none"></label>
    <label>Episodes checked per update <input type="number" name="page_size" min="1" max="500" value="{{.Cfg.Defaults.PageSize}}" required><small>Only the newest this-many episodes of a feed are considered on each update.</small></label>
    <label>Keep only the newest N downloaded episodes (0 = keep all) <input type="number" name="cleanup_keep_last" min="0" value="{{.Cfg.Defaults.CleanupKeepLast}}" required></label>
    <label>Delete episodes published more than N days ago (0 = never) <input type="number" name="cleanup_after_days" min="0" value="{{.Cfg.Defaults.CleanupAfterDays}}" required></label>
  </fieldset>
  <div class="actions"><button class="btn primary" type="submit">Save and apply</button></div>
</form>
<p class="muted">Config file: <code>{{.ConfigPath}}</code></p>
{{end}}
