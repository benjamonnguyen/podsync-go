# podsync configuration.
# This file is rewritten by the web UI when you change settings or feeds;
# comments you add by hand will not be preserved.

[download]
concurrency = 2
update_interval = "30m"
self_update = false

[defaults]
format = "audio"
max_resolution = 720
min_duration = "1m1s"
cleanup_keep_last = 50
page_size = 10

[[feeds]]
id = "adamragusea"
url = "https://www.youtube.com/channel/UC9_p50tH3WmMslWRWKnM7dQ"
