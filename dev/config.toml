# Development/test feed data; use dev/run.sh (starts syncr and the web UI) from anywhere.
# Ports, addresses and the data directory are flags in dev/run.sh now, not here.
# Note: the web UI rewrites this file when you change settings.

[download]
concurrency = 2
update_interval = "30m"
self_update = false

[defaults]
format = "audio"
max_resolution = 480
min_duration = "61s"
cleanup_keep_last = 50
page_size = 5

[[feeds]]
id = "adamragusea"
url = "https://www.youtube.com/channel/UC9_p50tH3WmMslWRWKnM7dQ"
