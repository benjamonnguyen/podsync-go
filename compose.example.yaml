services:
  podsync:
    image: podsync:latest
    # Build it yourself (multi-arch: docker buildx build --platform linux/amd64,linux/arm64 .):
    build: .
    container_name: podsync
    restart: unless-stopped
    volumes:
      - ./config:/config
      - ./data:/data
    # Run as your own user so files in ./config and ./data are yours (create both dirs first).
    user: "1000:1000"
    environment:
      TZ: UTC
      PODSYNC_BASE_URL: http://<this-host>:8080
      PODSYNC_USERNAME: admin
      PODSYNC_PASSWORD: change-me # required unless PODSYNC_WEBUI_DISABLED is true
      # Optional: cookies for YouTube sign-in checks (put cookies.txt in ./config):
      # PODSYNC_COOKIES_FILE: /config/cookies.txt
      # Optional: re-encode audio downloads (format = "audio") to mp3 instead of m4a:
      # PODSYNC_MP3_ENCODING: "true"
      # Optional: serve HTTPS directly instead of plain HTTP (cert/key must exist in the
      # container, e.g. bind-mounted in via ./config). The login page sends credentials and
      # the session cookie in the clear otherwise, so set these or put podsync behind a
      # reverse proxy that terminates TLS:
      # PODSYNC_TLS_CERT_FILE: /config/cert.pem
      # PODSYNC_TLS_KEY_FILE: /config/key.pem
    ports:
      - "8080:8080" # feeds, media, and the (login-protected) web UI

# ---- no web UI ----
# If you add feeds by hand-editing config.toml and never run the UI, add this to environment:
# above (and drop PODSYNC_USERNAME/PODSYNC_PASSWORD, which are then unused):
#   PODSYNC_WEBUI_DISABLED: "true"
