services:
  podsync:
    # image: podsync:latest
    # Build it yourself (multi-arch: docker buildx build --platform linux/amd64,linux/arm64 .):
    build: .
    container_name: podsync
    restart: unless-stopped
    volumes:
      # Mount the *directory*, not the single file: the app rewrites config.toml when you
      # change settings in the UI, and a single-file bind mount can't be replaced atomically.
      - ./config:/config
      # Downloaded media and metadata. Back this up; config.toml alone is enough to
      # re-create your feeds, but downloaded state lives here.
      - ./data:/data
    # The container starts as root and the entrypoint chowns ./config and ./data to
    # PUID:PGID before running podsync as that user — so a fresh ./config or ./data that
    # Docker auto-created as root:root (because it didn't exist on the host yet) still
    # "just works". Set these to your host user if you want the files it creates to be
    # yours outside the container too; the default (1000:1000) is fine otherwise.
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: UTC
      PODSYNC_BASE_URL: http://<this-host>:8080
      PODSYNC_USERNAME: admin
      PODSYNC_PASSWORD: change-me # required unless PODSYNC_WEBUI_DISABLED is true
      PODSYNC_YOUTUBE_API_KEY: your-key # required: a YouTube Data API v3 key (see the README)
      # YouTube cookies (for sign-in checks and members-only videos) are uploaded on the web
      # UI's Settings page and kept in ./config/cookies.txt; there is no variable for them.
      # Optional: use a yt-dlp other than the one baked into the image (must exist in the
      # container, e.g. bind-mounted in):
      # PODSYNC_YTDLP_PATH: /config/yt-dlp
      # Audio downloads (format = "audio") are re-encoded to mp3 by default; set this to
      # turn that off and keep the original m4a:
      # PODSYNC_MP3_ENCODING_DISABLED: "true"
      # Optional: serve HTTPS directly instead of plain HTTP (cert/key must exist in the
      # container, e.g. bind-mounted in via ./config). The login page sends credentials and
      # the session cookie in the clear otherwise, so set these or put podsync behind a
      # reverse proxy that terminates TLS:
      # PODSYNC_TLS_CERT_FILE: /config/cert.pem
      # PODSYNC_TLS_KEY_FILE: /config/key.pem
    ports:
      - "8080:8080" # feeds, media, and the (login-protected) web UI

# ---- no web UI ----
# If you add feeds by hand-editing config.toml and never run the UI, add this to environment:
# above (and drop PODSYNC_USERNAME/PODSYNC_PASSWORD, which are then unused):
#   PODSYNC_WEBUI_DISABLED: "true"
# YouTube cookies then go in by hand: put a Netscape-format cookies.txt in ./config next
# to config.toml.
