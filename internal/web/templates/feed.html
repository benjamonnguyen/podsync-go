{{define "content"}}
<p><a href="/">← Library</a></p>
<div class="feed-head">
  {{if .Card.ImageURL}}<img class="avatar large" src="{{.Card.ImageURL}}" alt="" referrerpolicy="no-referrer">{{else}}<div class="avatar large placeholder"></div>{{end}}
  <div class="grow">
    <h1>{{.Card.Name}}</h1>
    {{template "feed_stats" .Stats}}
    {{with .Card.Description}}<p class="clip">{{.}}</p>{{end}}
    <div class="rss">
      <label for="rss-url">Podcast feed URL</label>
      <input id="rss-url" type="text" class="rss-url" readonly value="{{.Card.RSSURL}}">
      <button class="btn" type="button" data-copy="#rss-url">Copy</button>
    </div>
  </div>
  <div class="actions vertical">
    <button class="btn" hx-post="/feed/{{.Card.ID}}/pull" hx-target="#status" hx-swap="outerHTML">Check now</button>
    <a class="btn" href="/feed/{{.Card.ID}}/settings">Feed settings</a>
    <a class="btn danger" href="/feed/{{.Card.ID}}/delete">Delete</a>
  </div>
</div>
<div class="toolbar">
  <input type="search" name="q" placeholder="Filter episodes…" autocomplete="off" aria-label="Filter episodes" hx-get="/feed/{{.Card.ID}}/episodes" hx-trigger="input changed delay:300ms, search" hx-target="#episodes" hx-swap="outerHTML">
</div>
{{template "episode_list" .}}
<div id="loaded" class="rows"></div>
<div id="more" class="center">
  <button class="btn" hx-get="/feed/{{.Card.ID}}/older?offset={{.Offset}}" hx-target="#more" hx-swap="outerHTML" hx-disabled-elt="this">Load more</button>
  <p class="muted">Looks further back in this feed for episodes that were not downloaded.</p>
</div>
{{end}}
