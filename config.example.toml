# Example podsync-go configuration: feeds and the settings the web UI edits.
# If the file doesn't exist the app creates one with these defaults.
# NOTE: the web UI rewrites this file when you change settings or feeds, which drops
# comments, so keep this example file for reference instead of annotating your live one.
#
# Everything about how the service is deployed (ports, the public address, the data
# directory, the yt-dlp cookies file) is a flag or environment variable instead, not
# part of this file. See compose.example.yaml for the full list, or run `podsync -help`.

[download]
# Maximum simultaneous downloads (1-16).
concurrency = 2
# How often every feed is checked for new episodes (minimum 1m).
update_interval = "30m"
# Run `yt-dlp -U` at startup and daily. YouTube changes often; keeping yt-dlp current avoids most failures.
self_update = false

# Defaults applied to every feed; each feed can override any of them.
[defaults]
format = "audio"            # "audio" (m4a) or "video" (mp4)
max_resolution = 720        # pixels of height; 0 = no limit
min_duration = "61s"        # skip videos shorter than this: 61s skips YouTube Shorts (60s or less); "0s" = download everything
page_size = 10              # only the newest N episodes of a feed are considered per update
cleanup_keep_last = 50      # keep the newest N downloaded episodes; 0 = keep all

# One [[feeds]] block per channel or playlist. Easiest is to add them from the web UI.
[[feeds]]
id = "UCXuqSBlHAE6Xw-yeJA0Tunw"     # channel ID (UC...) or playlist ID (PL...)
source = "youtube"
kind = "channel"                     # "channel" or "playlist"
name = "Linus Tech Tips"
# Optional per-feed overrides of any [defaults] key:
format = "audio"
page_size = 5
# Title filters exist per feed only (there are no global patterns). Go regular expressions, empty = off:
title_exclude = "(?i)sponsored|#shorts"   # matching titles are skipped
# title_include = "(?i)review"             # if set, only matching titles are downloaded
# opml_exclude = true                      # leave this feed out of the /opml.xml export; absent/false = included

