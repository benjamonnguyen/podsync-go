{{define "content"}}
<section class="panel">
  <form hx-post="/add/find" hx-target="#found" hx-disabled-elt="find button" hx-indicator="this" class="inline-form">
    <input type="text" name="q" placeholder="Channel name, @handle, or a YouTube channel or playlist link" required autocomplete="off" autofocus>
    <button class="icon-btn primary" type="submit" title="Find" aria-label="Find">{{template "icon_search"}}</button>
  </form>
</section>
<div id="found"></div>
{{end}}
