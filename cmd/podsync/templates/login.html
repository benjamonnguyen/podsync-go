<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · podsync-go</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%232563eb'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/style.css?v={{.AssetV}}">
</head>
<body>
<main class="auth">
  <section class="panel auth-card">
    <h1>podsync-go</h1>
    {{if .Err}}<div class="notice err">{{.Err}}</div>{{end}}
    <form method="post" action="/login" class="settings">
      <input type="hidden" name="next" value="{{.Next}}">
      <label>Username <input type="text" name="username" autocomplete="username" required autofocus></label>
      <label>Password <input type="password" name="password" autocomplete="current-password" required></label>
      <div class="actions"><button class="btn primary" type="submit">Sign in</button></div>
    </form>
  </section>
</main>
</body>
</html>
