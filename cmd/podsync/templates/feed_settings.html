{{define "content"}}
<p><a href="/feed/{{.F.ID}}">← {{.F.Name}}</a></p>
<h1>Feed settings</h1>
{{if .Flash}}<div class="notice ok">{{.Flash}}</div>{{end}}
{{if .Err}}<div class="notice err"><strong>Not saved.</strong><pre>{{.Err}}</pre></div>{{end}}
<form method="post" action="/feed/{{.F.ID}}/settings" class="settings">
  <fieldset>
    <label>Name <input type="text" name="name" value="{{.F.Name}}" required></label>
    <label>Format
      <select name="format">
        <option value="">Default ({{.F.Defaults.Format}})</option>
        <option value="video"{{if eq .F.Format "video"}} selected{{end}}>Video (mp4)</option>
        <option value="audio"{{if eq .F.Format "audio"}} selected{{end}}>Audio only (m4a)</option>
      </select></label>
    <label>Maximum resolution (0 = no limit) <input type="number" name="max_resolution" min="0" value="{{.F.MaxResolution}}" placeholder="{{.F.Defaults.MaxResolution}}"></label>
    <label>Skip videos shorter than <input type="text" name="min_duration" value="{{.F.MinDuration}}" placeholder="{{secs .F.Defaults.MinDuration}}"><small>For example 61s or 2m; 0 downloads everything.</small></label>
    <label>Only download titles matching (regex) <input type="text" name="title_include" value="{{.F.TitleInclude}}" placeholder="empty = all titles"></label>
    <label>Skip titles matching (regex) <input type="text" name="title_exclude" value="{{.F.TitleExclude}}" placeholder="empty = skip none"><small>Case-insensitive example: <code>(?i)sponsored|#shorts</code>. These patterns belong to this feed only.</small></label>
    <label>Episodes checked per update <input type="number" name="page_size" min="1" max="500" value="{{.F.PageSize}}" placeholder="{{.F.Defaults.PageSize}}"></label>
    <label>Keep only the newest N downloaded episodes (0 = keep all) <input type="number" name="cleanup_keep_last" min="0" value="{{.F.CleanupKeepLast}}" placeholder="{{.F.Defaults.CleanupKeepLast}}"></label>
    <label class="check"><input type="checkbox" name="opml_exclude"{{if .F.OPMLExclude}} checked{{end}}> Exclude from OPML export<small>Off by default: the feed is included in <code>/opml.xml</code>.</small></label>
  </fieldset>
  <div class="actions"><button class="btn primary" type="submit">Save</button></div>
</form>
{{end}}
